<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Practice Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="badge">Practice Project</div>
      <h1>My Practice Project</h1>
      <p class="description">
        Welcome to my practice project! This is a simple, clean, and responsive webpage built with plain HTML, CSS, and JavaScript.
      </p>

      <button id="actionBtn" class="btn" type="button">Click Me</button>

      <div id="messageBox" class="message-box hidden" role="status" aria-live="polite">
        <span class="icon">✨</span>
        <p id="messageText">Hello! You clicked the button successfully.</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
